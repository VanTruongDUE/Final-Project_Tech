<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md sm:p-gutter relative overflow-hidden">
<!-- Ambient Background Decoration (Subtle) -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed opacity-30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-fixed opacity-20 rounded-full blur-[100px]"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.05)] border border-outline-variant p-lg sm:p-xl relative z-10 backdrop-blur-sm">
<!-- Header / Branding -->
<div class="text-center mb-xl">
<h1 class="text-headline-lg font-headline-lg text-[#ee4d2d] tracking-tight mb-sm">TechToShop</h1>
<p class="text-on-surface-variant text-body-md font-body-md">Quản trị hệ thống &amp; Cửa hàng</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Email / Phone Input -->
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface" for="login_identifier">Email hoặc Số điện thoại</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-[12px] flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">person</span>
</div>
<input class="w-full h-[48px] pl-[40px] pr-[16px] bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-[#ee4d2d]/20 focus:border-[#ee4d2d] outline-none transition-all duration-200" id="login_identifier" name="login_identifier" placeholder="Nhập email hoặc số điện thoại" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface" for="login_password">Mật khẩu</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-[12px] flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="w-full h-[48px] pl-[40px] pr-[40px] bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-[#ee4d2d]/20 focus:border-[#ee4d2d] outline-none transition-all duration-200" id="login_password" name="login_password" placeholder="Nhập mật khẩu" required="" type="password">
<button aria-label="Hiện mật khẩu" class="absolute inset-y-0 right-0 pr-[12px] flex items-center text-on-surface-variant hover:text-[#ee4d2d] transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row (Remember Me & Forgot Password) -->
<div class="flex items-center justify-between mt-[-8px]">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center w-4 h-4">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest checked:bg-[#ee4d2d] checked:border-[#ee4d2d] focus:ring-2 focus:ring-[#ee4d2d]/20 outline-none transition-all cursor-pointer" id="remember_me" name="remember_me" type="checkbox">

<script>
        // Simple password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtns = document.querySelectorAll('button[aria-label="Hiện mật khẩu"]');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const icon = this.querySelector('.material-symbols-outlined');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                        this.setAttribute('aria-label', 'Ẩn mật khẩu');
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                        this.setAttribute('aria-label', 'Hiện mật khẩu');
                    }
                });
            });
        });
    </script>
