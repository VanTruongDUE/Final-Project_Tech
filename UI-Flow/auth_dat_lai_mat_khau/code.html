<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-md md:p-xl">
<!-- Main Container -->
<div class="w-full max-w-[480px] bg-surface-container-lowest border border-outline-variant rounded-lg card-shadow p-lg md:p-xl flex flex-col gap-lg font-['Inter']">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<div class="mx-auto w-12 h-12 bg-[#EE4D2D]/10 rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-[#EE4D2D] text-headline-md" data-icon="lock_reset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-[#EE4D2D] font-bold">Đặt lại mật khẩu</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Vui lòng nhập mật khẩu mới cho tài khoản TechToShop của bạn.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- New Password -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="new_password">Mật khẩu mới</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-DEFAULT text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-[#EE4D2D] focus:ring-offset-2 focus:border-transparent" id="new_password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-DEFAULT text-on-surface bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-[#EE4D2D] focus:ring-offset-2 focus:border-transparent" id="confirm_password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Security Notice -->
<div class="bg-surface-bright border border-outline-variant rounded-DEFAULT p-3 flex items-start gap-2 mt-2">
<span class="material-symbols-outlined text-[#EE4D2D] text-[20px] mt-0.5" data-icon="info">info</span>
<p class="text-label-md font-label-md text-on-surface-variant">Mật khẩu phải dài ít nhất 8 ký tự, bao gồm chữ cái và số.</p>
</div>
<!-- Submit Button -->
<div class="bg-[#16A34A]/10 border border-[#16A34A] rounded-DEFAULT p-3 flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-[#16A34A] text-[20px]" data-icon="check_circle">check_circle</span>
<p class="text-label-md font-label-md text-[#16A34A]">Mật khẩu đã được cập nhật thành công!</p>
</div><button class="w-full h-[48px] bg-[#EE4D2D] text-on-primary rounded-lg text-label-md font-label-md hover:bg-[#EE4D2D]/90 transition-colors mt-md flex items-center justify-center gap-2" type="submit">
        Cập nhật mật khẩu
        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer link -->
<div class="text-center mt-md">
<a class="text-label-md font-label-md text-[#EE4D2D] hover:underline flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
        Quay lại đăng nhập
      </a>
