</button>

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            // Restrict to single digit
            input.addEventListener('input', function(e) {
                if (this.value.length > 1) {
                    this.value = this.value.slice(0, 1);
                }
                // Auto-advance
                if (this.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Handle backspace to go to previous input
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Demo Form Submit to clear error or show state
        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Just for demonstration, shake the inputs to show error state
            const inputContainer = document.querySelector('.flex.justify-between');
            inputContainer.classList.add('animate-pulse');
            setTimeout(() => {
                inputContainer.classList.remove('animate-pulse');
            }, 500);
        });

        // Simple Countdown Demo
        let timeLeft = 59;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                clearInterval(timer);
                countdownEl.textContent = "";
                resendBtn.classList.remove('text-primary');
                resendBtn.classList.add('text-[#EE4D2D]'); // highlight when active
                resendBtn.disabled = false;
            } else {
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownEl.textContent = `(00:${seconds})`;
            }
        }, 1000);
    </script>
