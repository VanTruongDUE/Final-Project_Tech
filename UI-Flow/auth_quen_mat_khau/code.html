<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-lg">

<p class="text-body-md font-body-md text-on-surface-variant mt-sm">
                Nhập Email hoặc Số điện thoại của bạn để nhận mã OTP khôi phục mật khẩu.
            </p>
</header>
<!-- Form Section -->
<div class="p-lg md:p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Input Field -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-sm" for="contact-info">Email hoặc Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-[40px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-[#EE4D2D] focus:border-transparent transition-shadow" id="contact-info" name="contact-info" placeholder="VD: user@example.com hoặc 0987654321" type="text">
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-[#EE4D2D] text-on-primary text-body-lg font-headline-md rounded-lg flex items-center justify-center gap-sm hover:opacity-90 transition-opacity shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#EE4D2D]" type="submit">
                    Gửi mã OTP
                    <span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-lg text-center">
<a class="inline-flex items-center gap-sm text-body-md font-headline-md text-[#EE4D2D] hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[16px] text-[#EE4D2D]" data-icon="arrow_back">arrow_back</span>
