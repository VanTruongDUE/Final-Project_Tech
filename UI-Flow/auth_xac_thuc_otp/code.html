<!-- Form Area -->
<form class="w-full flex flex-col gap-lg" id="otp-form">

<div class="flex justify-between gap-sm sm:gap-md" id="otp-inputs">

<input class="w-10 h-12 sm:w-12 sm:h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-[#EE4D2D] focus:border-[#EE4D2D] transition-all shadow-sm" disabled="" maxlength="1" pattern="\d*" required="" type="number">

<span class="material-symbols-outlined text-[16px]">arrow_back</span>

            </a>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-inputs input');
            const submitBtn = document.getElementById('submit-btn');
            const form = document.getElementById('otp-form');
            const errorMessage = document.getElementById('error-message');
            
            const timerText = document.getElementById('timer-text');
            const timeSpan = document.getElementById('time');
            const resendBtn = document.getElementById('resend-btn');

            // --- OTP Input Logic ---
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    
                    // Clear error state on input
                    inputs.forEach(i => i.classList.remove('border-error', 'ring-error'));
                    errorMessage.classList.add('hidden');

                    if (val.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].disabled = false;
                            inputs[index + 1].focus();
                        }
                    }
                    
                    // Prevent entering more than 1 char
                    if (val.length > 1) {
                        e.target.value = val.slice(0, 1);
                    }

                    checkAllFilled();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (e.target.value === '' && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index].disabled = true;
                        }
                        // Allow deletion
                    }
                });

                // Handle pasting
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, ''); // Get max 6 digits
                    
                    if (pastedData) {
                        let i = 0;
                        while (i < pastedData.length && i < inputs.length) {
                            inputs[i].disabled = false;
                            inputs[i].value = pastedData[i];
                            i++;
                        }
                        if (i < inputs.length) {
                            inputs[i].disabled = false;
                            inputs[i].focus();
                        } else {
                            inputs[inputs.length - 1].focus();
                        }
                        checkAllFilled();
                    }
                });
            });

            function checkAllFilled() {
                let allFilled = true;
                inputs.forEach(input => {
                    if (input.value === '') {
                        allFilled = false;
                    }
                });
                submitBtn.disabled = !allFilled;
            }

            // --- Form Submission Simulation ---
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Đang xử lý...';
                submitBtn.disabled = true;

                // Simulate API call
                setTimeout(() => {
                    const otpValue = Array.from(inputs).map(i => i.value).join('');
                    
                    // Mock error scenario for demonstration (e.g., if OTP is 123456 it fails)
                    if(otpValue === '123456') {
                         submitBtn.innerHTML = 'Xác nhận';
                         submitBtn.disabled = false;
                         errorMessage.classList.remove('hidden');
                         inputs.forEach(i => {
                             i.classList.add('border-error', 'ring-error');
                             i.value = ''; // clear inputs
                         });
                         inputs[1].disabled = true; inputs[2].disabled = true; inputs[3].disabled = true; inputs[4].disabled = true; inputs[5].disabled = true;
                         inputs[0].focus();
                    } else {
                         // Success scenario
                         submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Thành công';
                         submitBtn.classList.replace('bg-[#EE4D2D]', 'bg-tertiary-container');
                         submitBtn.classList.remove('hover:bg-surface-tint', 'active:bg-primary-container');
                    }
                }, 1500);
            });

            // --- Countdown Timer Logic ---
            let timeLeft = 59;
            let timerId;

            function startTimer() {
                clearInterval(timerId);
                timeLeft = 59;
                timerText.classList.remove('hidden');
                resendBtn.classList.add('hidden');
                
                timerId = setInterval(() => {
                    timeLeft--;
                    const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                    timeSpan.textContent = `00:${seconds}`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerText.classList.add('hidden');
                        resendBtn.classList.remove('hidden');
                    }
                }, 1000);
            }

            resendBtn.addEventListener('click', () => {
                // Simulate resend action
                startTimer();
                // Reset inputs conceptually
                inputs.forEach(i => { i.value = ''; i.classList.remove('border-error', 'ring-error'); });
                inputs[1].disabled = true; inputs[2].disabled = true; inputs[3].disabled = true; inputs[4].disabled = true; inputs[5].disabled = true;
                inputs[0].focus();
                submitBtn.disabled = true;
                errorMessage.classList.add('hidden');
            });

            // Initialize timer
            startTimer();
        });
    </script>
