<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface font-body-md">
<!-- Registration Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_12px_32px_rgba(0,0,0,0.1)] p-lg md:p-xl border border-outline-variant">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="text-headline-lg font-headline-lg text-[#ee4d2d] tracking-tight mb-sm font-bold">TechToShop</h1>
<h2 class="text-headline-md font-headline-md text-on-surface font-bold">Tạo tài khoản mới</h2>
<p class="text-body-md font-body-md text-on-surface-variant mt-xs">Điền thông tin bên dưới để bắt đầu</p>
</div>
<!-- Registration Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Full Name Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs font-medium" for="fullname">Họ tên</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-lg bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#ee4d2d] focus:border-[#ee4d2d] transition-all duration-200" id="fullname" name="fullname" placeholder="Nhập họ và tên" required="" type="text">
</div>
</div>
<!-- Email Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs font-medium" for="email">Email</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-lg bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#ee4d2d] focus:border-[#ee4d2d] transition-all duration-200" id="email" name="email" placeholder="Nhập địa chỉ email" required="" type="email">
</div>
</div>
<!-- Phone Number Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs font-medium" for="phone">Số điện thoại</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-lg bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#ee4d2d] focus:border-[#ee4d2d] transition-all duration-200" id="phone" name="phone" placeholder="Nhập số điện thoại" required="" type="tel">
</div>
</div>
<!-- Password Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs font-medium" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-lg bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#ee4d2d] focus:border-[#ee4d2d] transition-all duration-200" id="password" name="password" placeholder="Tạo mật khẩu" required="" type="password">
</div>
</div>
<!-- Confirm Password Input -->
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs font-medium" for="confirm_password">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant rounded-lg bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-[#ee4d2d] focus:border-[#ee4d2d] transition-all duration-200" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu" required="" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<div class="flex items-center h-5 mt-0.5">
<input class="w-4 h-4 rounded border-outline-variant text-[#ee4d2d] focus:ring-[#ee4d2d] focus:ring-2 bg-surface-container-lowest cursor-pointer transition-colors" id="terms" name="terms" required="" type="checkbox">
</div>
<label class="text-body-md font-body-md text-on-surface-variant cursor-pointer font-medium" for="terms">Tôi đồng ý với <a class="text-[#ee4d2d] hover:text-[#d63c1e] font-medium hover:underline transition-colors" href="#">Điều khoản sử dụng</a> và <a class="text-[#ee4d2d] hover:text-[#d63c1e] font-medium hover:underline transition-colors" href="#">Chính sách bảo mật</a> của TechToShop.</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-md bg-[#ee4d2d] hover:bg-[#d63c1e] text-on-primary rounded-lg text-label-md font-label-md flex justify-center items-center gap-sm transition-all duration-200 shadow-sm hover:shadow-md active:scale-[0.98] font-bold" type="submit">
                Đăng ký
            </button>
</form>
<!-- Login Redirect Link -->
<div class="mt-lg text-center text-body-md font-body-md text-on-surface-variant border-t border-outline-variant pt-lg">
            Đã có tài khoản? 
            <a class="text-[#ee4d2d] font-bold hover:text-[#d63c1e] hover:underline transition-colors ml-1" href="#">Đăng nhập ngay</a>
</div>
